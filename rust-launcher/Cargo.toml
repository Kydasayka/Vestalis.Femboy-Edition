[package]
name = "vestalis-launcher"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Vestalis launcher — Rust rewrite"
license = "MIT"
publish = false

[dependencies]
slint = "1.8"
# The facade does not re-export the SVG decoder feature; enabling it on the
# matching core crate makes `@image-url` work for the logo asset.
i-slint-core = { version = "1.18.1", features = ["svg"], default-features = false }

anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "sync", "time", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
sha1 = "0.10"
hex = "0.4"
regex = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
winreg = "0.52"
sysinfo = "0.30"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

[build-dependencies]
slint-build = "1.8"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
